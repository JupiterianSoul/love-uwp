name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uwp-x64:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: deps/downloads
          key: downloads-${{ hashFiles('scripts/fetch-sources.ps1') }}

      - name: Fetch sources
        shell: pwsh
        run: ./scripts/fetch-sources.ps1

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version "11.5.${{ github.run_number }}.0"

      - name: List package
        shell: pwsh
        run: Get-ChildItem -Recurse out/layout | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200

      - uses: actions/upload-artifact@v4
        with:
          name: love-uwp-x64
          path: |
            out/*.appx
            out/*.cer
            out/Dependencies/**

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem out/*.appx, out/*.cer, out/Dependencies/x64/*.appx | ForEach-Object { $_.FullName })
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --prerelease --notes "Test-signed UWP x64 build of LOVE 11.5. No game included. Install the .cer, then the .appx with the VCLibs dependency." $files
